["Histoire","Qui est mandaté en 1931 par le Congrès américain pour construire un indicateur mesurant les effets de la Grande Dépression ?",["John Maynard Keynes","Simon Kuznets","William Petty","Vauban"],1,"Kuznets (Nobel 1971) construit le PIB ; Keynes et ses équipes l’amélioreront ensuite."],
["Histoire","Le PIB par habitant devient la mesure phare du développement à la suite de…",["la crise de 1929","la création de l’OCDE (1960)","la conférence de Bretton Woods (1944)","la Théorie générale (1936)"],2,"Bretton Woods (1944). L’OCDE fixe ensuite les principes de la comptabilité nationale dans le monde entier."],
["Histoire","Quel était l’objectif premier de Petty, King, Vauban et Boisguilbert ?",["Mesurer le chômage","Étudier comment les taxes (guerres) affectaient les revenus","Calculer la dette publique","Comparer les pays"],1,"Début de mesure du revenu national pour étudier l’effet des taxes prélevées pour la guerre."],
["Circuit","Un ménage achète pour 10 € de pain. Salaires 8 €, profit 2 €. Quelle richesse a été créée ?",["10 €","20 € (dépenses + revenus)","8 €","18 €"],0,"On calcule par la dépense (10 €) OU par les revenus (8 + 2 = 10 €), mais jamais les deux additionnés."],
["Circuit","Le boulanger achète un pétrin 9 € et produit 2 pains vendus 20 €. Salaire 8 €, profit 3 €. Que montre 20 = 8 + 9 + 3 ?",["La richesse a augmenté de 9 €","Les revenus sont la répartition de la richesse créée (20 €)","Le pétrin est un bien final","Le profit vaut 20 €"],1,"La richesse produite est 20 € ; les revenus indiquent seulement comment elle est répartie entre travail, capital et profit."],
["Circuit","Le boulanger paie farine, sel et eau (1,60 €) et vend toujours 20 €. Que devient la valeur créée dans l’économie ?",["Elle baisse de 1,60 €","Elle monte de 1,60 €","Elle ne change pas : 20 € transitent toujours","Elle est nulle"],2,"Ce qui change, c’est la répartition (le profit tombe à 1,40 €), pas la valeur du bien final."],
["Production","Parmi ces éléments, lequel est un bien intermédiaire pour le boulanger ?",["Le pain vendu au client","La farine achetée au meunier","Le salaire versé","Le dividende de l’actionnaire"],1,"Bien intermédiaire : acheté par une firme à une autre et utilisé dans la production. Le pain est le bien final."],
["Production","Le capital technique se divise en…",["capital financier et humain","capital fixe (durable) et capital circulant (un seul cycle)","travail et terre","capital nominal et réel"],1,"Fixe : biens d’équipement durables ; circulant : matières premières, énergie… utilisés sur un seul cycle."],
["Production","Comment est rémunéré le facteur capital ?",["Salaire","Rente uniquement","Intérêts et dividendes","Impôts"],2,"Travail → salaire ; capital → intérêts, dividendes (et coût du capital circulant)."],
["Circuit","Laquelle de ces dépenses de l’État n’est PAS comptée dans G ?",["Achat de fournitures pour l’armée","Salaires dans l’éducation (service public)","Allocations chômage (transferts sociaux)","Construction d’une route"],2,"G = achats de biens et services par l’État. Les transferts sociaux sont des redistributions, pas des achats."],
["Circuit","Les marchés financiers sont le lieu où…",["se vendent les biens finaux","se rencontrent offre et demande de titres financiers : l’épargne finance entreprises et État","s’échange le travail","l’État fixe les prix"],1,"Épargne placée, actions et emprunts émis par les firmes, emprunts étatiques, prêts étrangers."],
["PIB","Le PIB est…",["la somme de toutes les ventes de l’économie","la valeur totale des biens et services finaux produits dans une économie sur une période donnée","le revenu des résidents","la richesse accumulée"],1,"Uniquement les biens et services finaux, sur une période (en général un an)."],
["PIB","Le pain vaut 1,50 €. Farine + eau + électricité + pétrin coûtent 1,20 €. Quelle est la valeur ajoutée du boulanger ?",["1,20 €","1,50 €","0,30 €","2,70 €"],2,"VA = production − consommations intermédiaires = 1,50 − 1,20 = 0,30 € (travail 0,20 + bénéfice 0,10)."],
["PIB","La farine vendue par le meunier au boulanger entre dans le PIB…",["directement","indirectement, via le prix du pain","jamais, même indirectement","uniquement si elle est exportée"],1,"Elle n’est pas comptée à part, mais sa valeur est incorporée au prix du pain final."],
["PIB","Un ménage revend sa voiture d’occasion à un autre ménage. Effet sur le PIB ?",["Il augmente du prix de vente","Aucun : aucune valeur nouvelle n’est créée","Il diminue","Il augmente de la valeur ajoutée du vendeur"],1,"Elle a déjà été comptée à sa sortie d’usine. Une transaction n’entre dans le PIB que si elle crée de la valeur."],
["PIB","Une entreprise produit des vêtements non vendus qu’elle stocke pour l’an prochain. En année 1, le PIB…",["ne change pas","inclut leur valeur (production destinée aux stocks)","baisse","inclut leur valeur seulement l’année 2"],1,"On fait « comme si » l’entreprise les achetait à elle-même. L’année suivante, le déstockage n’affecte pas le PIB."],
["PIB","Comment la comptabilité nationale valorise-t-elle les services publics non marchands (police, pompiers) ?",["Elle ne les compte pas","À leur coût, essentiellement la rémunération des fonctionnaires (valeur imputée)","Au prix du marché privé","Par les impôts perçus"],1,"Pas de prix de marché → on impute une valeur sur la base du coût."],
["PIB","Lequel de ces éléments est EXCLU du PIB ?",["Dépenses d’investissement des entreprises","Variation des stocks","Achat d’actions et d’obligations (titres financiers)","Services de l’État"],2,"Les titres financiers sont des flux purement financiers : ni production ni vente de biens finaux."],
["PIB","À propos de l’économie souterraine :",["Elle est comptée dans le PIB","Elle représente jusqu’à 50 % du PIB dans les pays en développement et n’est pas intégrée au PIB","Elle ne concerne que des activités illégales","Elle augmente avec le niveau de développement"],1,"~10 % dans les pays développés ; sa part décroît avec le développement et la qualité des institutions."],
["3 approches","Quelle est la décomposition du PIB par la demande finale ?",["C + S + T","C + I + G + (X − M)","salaires + profits","C + I + G + X + M"],1,"Consommation, investissement, dépenses publiques, exportations nettes."],
["3 approches","Calculer le PIB : C = 600, I = 200, G = 250, X = 150, M = 180.",["1 380","1 200","1 020","1 000"],2,"600 + 200 + 250 + (150 − 180) = 1 020."],
["3 approches","Une entreprise achète un robot qui servira plusieurs années. Dans le PIB, c’est…",["un bien intermédiaire exclu","de l’investissement (I), compté comme vente finale","de la consommation des ménages","un titre financier"],1,"Le capital fixe sert à plusieurs cycles : il n’est pas « détruit » comme un intermédiaire."],
["3 approches","Dans la minière → Sidemetal → Reugeot (ventes 4 200, 9 000, 21 500 €), quelle est la VA de Sidemetal ?",["9 000 €","4 200 €","4 800 €","12 500 €"],2,"9 000 − 4 200 (minerai acheté) = 4 800 €. Somme des VA : 4 200 + 4 800 + 12 500 = 21 500 €."],
["3 approches","Dans cet exemple, par la demande finale, le PIB vaut…",["34 700 € (somme des ventes)","21 500 € (seules les voitures sont vendues à l’utilisateur final)","4 200 €","9 000 €"],1,"Les trois approches (demande, VA, revenus des facteurs) donnent le même chiffre."],
["3 approches","Par l’approche des revenus des facteurs, le PIB est la somme de…",["C, I, G et X − M","salaires, intérêts, rente et profits","VA moins consommations intermédiaires","impôts et épargne"],1,"Salaires (travail), intérêts (capital), rente (terres), profits (actionnaires)."],
["3 approches","Si (S − I) = −50 et (T − G) = −20, que vaut le compte courant (X − M) ?",["+70","−70 : déficit courant","−30","0"],1,"(S − I) + (T − G) = X − M. Un pays qui investit plus qu’il n’épargne emprunte au reste du monde."],
["PIB / PNB","Un résident français loue un appartement à Londres. Le loyer entre…",["dans le PIB français et le PNB britannique","dans le PIB britannique et le PNB français","uniquement dans le PIB britannique","dans aucun des deux"],1,"PIB = critère de territoire ; PNB = critère de nationalité (revenus perçus par les résidents, y compris à l’étranger)."],
["PIB / PNB","Quelle formule est correcte ?",["PNB = PIB + revenus reçus du reste du monde − revenus versés au reste du monde","PNB = PIB − revenus reçus du reste du monde","PNB = PIB − amortissements","PNB = C + I + G"],0,"PNN = PNB − amortissements (consommation de capital fixe)."],
["Réel / nominal","Le PIB réel est calculé…",["aux prix courants","aux prix d’une année de base fixe, pour isoler l’évolution des quantités","en euros constants sans inflation du tout","uniquement sur les biens exportés"],1,"Le PIB nominal utilise les prix courants de l’année de production."],
["Réel / nominal","En 2018, PIB nominal = 7 060 et PIB réel (base 2017) = 5 730. Quel est le déflateur ?",["0,81","1,23","1,58","1,02"],1,"Déflateur = nominal / réel = 7 060 / 5 730 ≈ 1,23."],
["Réel / nominal","PIB nominal : +8,15 %. Déflateur : +5 %. Le PIB réel croît d’environ…",["13 %","3 %","5 %","8 %"],1,"Croissance nominale ≈ croissance réelle + inflation, donc 8,15 − 5 ≈ 3 %."],
["Réel / nominal","PIB +10 %, population +3 %. Le PIB par habitant croît d’environ…",["13 %","30 %","7 %","3 %"],2,"Δ%(Y/L) ≈ Δ%Y − Δ%L = 10 − 3 = 7 % (exactement 6,8 %)."],
["Réel / nominal","Au Liban, le PIB à prix courants explose mais le PIB à prix constants baisse. Pourquoi ?",["Forte croissance réelle","La hausse nominale vient de l’inflation, derrière une vraie crise","Erreur de mesure","Hausse des exportations"],1,"Moralité : toujours regarder le PIB réel."],
["Prix","Un panier coûte 2 075 € en t (base) et 2 182,50 € en t+1. L’indice en t+1 vaut…",["105,18","5,18","110,5","94,9"],0,"(2 182,5 / 2 075) × 100 = 105,18, soit une inflation de 5,18 %."],
["Prix","Pourquoi pondérer le panier de l’indice des prix ?",["Pour simplifier","Pour que le pain, consommé par tous, pèse plus que le caviar","Pour exclure les importations","Pour avoir un indice égal à 100"],1,"Une moyenne simple mettrait tous les biens sur un pied d’égalité."],
["Prix","La déflation correspond à…",["un ralentissement de l’inflation","un taux d’inflation négatif : baisse générale des prix","une baisse du PIB","une hausse du pouvoir d’achat"],1,"Ralentissement de l’inflation = désinflation (le taux reste positif)."],
["Prix","Dans l’IPC de l’INSEE :",["les logements possédés et les loyers payés sont inclus","les logements possédés sont exclus, les loyers payés sont inclus","les crédits sont inclus","les loyers sont exclus"],1,"Logement possédé = bien patrimonial ; loyer = service consommé ; crédits exclus."],
["Prix","Évolution du pouvoir d’achat =",["Δ revenu disponible − Δ prix","Δ prix − Δ revenu disponible","Δ PIB − Δ IPC","Δ salaires + Δ prix"],0,"Revenu disponible = ce que l’on reçoit moins ce que l’on verse (cotisations, impôts directs)."],
["Prix","L’inflation sous-jacente exclut…",["les loyers","les prix administrés (tabac, tarifs publics) et très volatils (énergie, produits frais)","les services","les importations"],1,"Elle permet de mieux apprécier la tendance de fond des prix."],
["Prix","Quelle différence entre IPC et déflateur du PIB ?",["IPC : panier constant (Laspeyres), biens consommés y compris importés ; déflateur : panier évolutif (Paasche), biens produits sur le territoire","Aucune","L’IPC est de Paasche, le déflateur de Laspeyres","Le déflateur inclut les importations"],0,"Au Liban, l’IPC grimpe plus vite : l’effondrement de la livre fait exploser les prix des importés."]
]}
,{id:"m1",m:"Microéconomie",t:"Chapitre 1 – Les consommateurs",q:[
["Préférences","Un panier de biens est…",["une liste donnant la quantité de chacun des biens","l’ensemble de tous les paniers possibles","la liste des prix des biens","le revenu du consommateur"],0,"Q = (q1 ; q2 ; … ; qn). L’ensemble de tous les paniers possibles s’appelle l’espace des biens."],
["Préférences","Un bien privé est un bien dont la consommation est…",["rivale et excluable","non rivale et excluable","rivale et non excluable","non rivale et non excluable"],0,"Rivale : si je mange du pain, il y en a moins pour les autres. Excluable : on peut exclure les autres de cette consommation."],
["Préférences","Que signifie « préférences exogènes » ?",["Elles dépendent des prix","Ce sont les goûts du consommateur, indépendants de ceux des autres","Elles changent avec le revenu","Elles sont identiques pour tous"],1,"Les préférences sont les goûts du consommateur : elles portent sur des biens ou des paniers et les préférences des uns sont indépendantes de celles des autres."],
["Préférences","Des préférences monotones signifient que le consommateur…",["préfère toujours plus à moins","préfère la diversité uniquement","est indifférent entre tous les paniers","compare seulement deux paniers"],0,"Exemple : le panier A (2 ; 2) est préféré au panier B (1 ; 1). La préférence pour les mélanges est une autre hypothèse, qui donne la convexité."],
["Préférences","Des préférences sont rationnelles si elles respectent…",["la monotonie et la continuité","la complétude et la transitivité","la convexité et la concavité","la rivalité et l’excluabilité"],1,"Complétude : on sait comparer tous les paniers. Transitivité : si A > B et B > C, alors A > C."],
["Préférences","Si le consommateur préfère A à B et B à C, alors avec des préférences rationnelles il…",["préfère C à A","est indifférent entre A et C","préfère A à C","ne peut pas comparer A et C"],2,"C’est la transitivité : A > B et B > C impliquent A > C."],
["Utilité","La fonction d’utilité est…",["croissante, continue et concave","linéaire et décroissante","convexe et exponentielle","décroissante et continue"],0,"Elle croît avec des gains de moins en moins grands. La concavité vient du fait que le consommateur préfère les mélanges."],
["Utilité","Pour une fonction croissante et concave, on a…",["F′(x) > 0 et F″(x) < 0","F′(x) > 0 et F″(x) > 0","F′(x) < 0 et F″(x) < 0","F′(x) = constante et F″(x) = 0"],0,"Croissante : F′ > 0. Concave : F″ < 0. Convexe croissante : F″ > 0. Linéaire : F′ constante et F″ = 0."],
["Utilité","L’utilité marginale Um(x) = dU/dx représente…",["l’utilité totale du panier","l’accroissement d’utilité provenant d’une unité supplémentaire de bien","le prix du bien","la quantité de bien consommée"],1,"C’est le raisonnement marginaliste : on regarde l’effet d’une unité supplémentaire en dérivant."],
["Utilité","Que signifie « utilité marginale décroissante » ?",["Plus on consomme, moins l’utilité totale est élevée","Chaque unité supplémentaire apporte de moins en moins d’utilité","Le consommateur arrête de consommer","L’utilité devient négative"],1,"L’utilité totale continue de croître, mais de moins en moins vite : c’est ce qui rend la fonction concave."],
["Courbes d’indifférence","Une courbe d’indifférence est l’ensemble des paniers…",["qui coûtent le même prix","qui procurent le même niveau d’utilité","qui contiennent la même quantité du bien 1","que le consommateur peut acheter"],1,"Entre deux paniers de la même courbe, le consommateur est indifférent."],
["Courbes d’indifférence","Sur une carte d’indifférence, le niveau de satisfaction est plus élevé…",["vers le sud-ouest","vers le nord-est","sur les axes","au point d’intersection des courbes"],1,"Plus on consomme, plus on est heureux : une courbe plus au nord-est correspond à plus de satisfaction."],
["Courbes d’indifférence","Deux courbes d’indifférence…",["peuvent se croiser en un point","ne peuvent jamais se croiser","se croisent toujours","sont toujours des droites"],1,"Si elles se croisaient, le panier d’intersection aurait deux niveaux d’utilité, ce qui n’a aucun sens."],
["Courbes d’indifférence","Une courbe d’indifférence « classique » est…",["croissante et concave","décroissante et convexe","croissante et convexe","décroissante et concave"],1,"Décroissante (ou au moins pas croissante) et convexe, à cause de la préférence pour les mélanges. Elle est aussi asymptote aux axes."],
["TMS","Le TMS q1q2 est la quantité de bien 2 à laquelle on est prêt à renoncer pour obtenir…",["une unité entière de bien 1, en gardant le revenu constant","une quantité infiniment petite de bien 1, en gardant l’utilité constante","une quantité infiniment petite de bien 1, en gardant le prix constant","une unité de bien 2 supplémentaire"],1,"C’est un taux subjectif, calculé de façon marginale (variation infiniment petite) à utilité constante."],
["TMS","Graphiquement, le TMS est…",["l’ordonnée à l’origine de la courbe d’indifférence","la pente de la courbe d’indifférence en ce point","la pente de la droite de budget","l’aire sous la courbe"],1,"C’est le coefficient directeur de la courbe d’indifférence au point considéré, comme une mini-droite entre deux points voisins A et B."],
["TMS","Le TMS q1q2 est égal au rapport…",["Um2 / Um1","Um1 / Um2","p1 / p2","q1 / q2"],1,"TMS q1q2 = Um1 / Um2. À ne pas confondre avec p1/p2, qui est le taux objectif de la droite de budget."],
["TMS","Le long d’une courbe d’indifférence convexe, le TMS…",["est constant","varie selon l’endroit où l’on se place","est toujours nul","est toujours infini"],1,"Le taux d’échange subjectif dépend de mes préférences et de mon niveau de consommation. Il n’est constant que pour des substituts parfaits."],
["Cas particuliers","Le Pepsi et le Coca (biens identiques) sont des biens…",["complémentaires","inutiles","substituables","inférieurs"],2,"Pour des substituts parfaits, 1 unité de bien 1 = 1 unité de bien 2 : la courbe d’indifférence est une droite et le TMS est constant."],
["Cas particuliers","Pour deux biens parfaitement substituables, la courbe d’indifférence est…",["une courbe convexe","une courbe en L","une droite","une hyperbole"],2,"Exemple : A = (4 ; 0), B = (2 ; 2), C = (0 ; 4) sont sur la même droite et le TMS est constant (ici égal à 1)."],
["Cas particuliers","La voiture et l’essence sont des biens complémentaires. Leurs courbes d’indifférence sont…",["des droites","des courbes en L","des courbes asymptotes aux axes","des courbes croissantes"],1,"Les biens sont consommés dans une certaine proportion, au coin de l’équerre. Le TMS vaut soit 0, soit l’infini."],
["Budget","La contrainte budgétaire s’écrit…",["R = pa·qa + pb·qb","R = qa + qb","R = pa / pb","R = pa·pb·qa·qb"],0,"R = revenu, pa et pb = prix, qa et qb = quantités. Exemple : 300 = 25·Qp + 50·Qj."],
["Budget","La droite de budget est…",["l’ensemble des paniers qui épuisent exactement le revenu","l’ensemble des paniers qui coûtent moins que le revenu","l’ensemble des paniers préférés","la courbe d’indifférence la plus haute"],0,"Ne pas confondre : la contrainte budgétaire est la condition R ≥ dépenses ; la droite de budget est le cas où le revenu est entièrement dépensé (saturation)."],
["Budget","La pente de la droite de budget qb = R/pb − (pa/pb)·qa vaut…",["pa / pb","− pa / pb","− pb / pa","R / pb"],1,"C’est le rapport des prix : un taux objectif auquel on peut échanger du bien a contre du bien b. Il dépend de la façon dont on place les axes."],
["Budget","Dans la droite de budget, l’abscisse à l’origine vaut…",["R / pb","R / pa","pa / pb","pb / pa"],1,"Abscisse à l’origine : R/pa (tout le revenu dans le bien a). Ordonnée à l’origine : R/pb."],
["Budget","Avec 300 = 25·Qp + 50·Qj, combien de pulls au maximum (Qj = 0) ?",["6","12","25","50"],1,"300 / 25 = 12 pulls. Et au maximum 300 / 50 = 6 articles de l’autre bien."],
["Budget","Avec 50 = 2q1 + 5q2, quelle est la quantité maximale de q2 ?",["10","25","2,5","5"],0,"q2 = 50/5 − (2/5)·q1 : ordonnée à l’origine 10 (et abscisse à l’origine 50/2 = 25)."],
["Budget","Une hausse du revenu se traduit par…",["un changement de pente de la droite de budget","un déplacement parallèle vers l’extérieur de la droite de budget","un déplacement parallèle vers l’intérieur","aucun changement"],1,"Les prix n’ont pas changé, donc la pente −pa/pb reste identique. Une baisse du revenu déplace la droite vers l’intérieur."],
["Budget","Si le prix du bien a augmente (a en abscisse), la droite de budget…",["se déplace parallèlement vers l’extérieur","devient plus pentue, avec une abscisse à l’origine plus faible","devient moins pentue","ne change pas"],1,"La pente −pa/pb augmente en valeur absolue, et R/pa diminue. Un changement de prix modifie la pente, pas un simple déplacement."],
["Choix optimal","Le panier optimal est celui qui appartient…",["à la droite de budget et à la courbe d’indifférence la plus élevée possible","à n’importe quelle courbe d’indifférence","à l’intérieur de l’ensemble budgétaire","à la courbe d’indifférence la plus haute, quel que soit le budget"],0,"Une courbe d’utilité plus élevée est inatteignable budgétairement."],
["Choix optimal","La condition d’optimalité (cas classique) est…",["TMS = pa / pb","TMS = 1","Um1 = Um2","R = 0"],0,"Le taux subjectif d’échange (TMS) est égal au taux objectif (rapport des prix) : c’est le point de tangence."],
["Choix optimal","Au point de tangence entre la courbe d’indifférence et la droite de budget…",["les deux fonctions sont égales","les dérivées sont égales (même coefficient directeur)","les deux fonctions sont perpendiculaires","les deux fonctions sont parallèles"],1,"À une simple intersection, ce sont les valeurs qui sont égales ; à la tangence, ce sont les dérivées (même pente)."],
["Choix optimal","Méthode de substitution : on remplace qb par…",["R/pa − (pb/pa)·qa","R/pb − (pa/pb)·qa","R − pa·qa","pa/pb"],1,"On maximise alors U(qa ; R/pb − pa·qa/pb) et la condition du premier ordre ∂U/∂qa = 0 donne pa/pb = Um_a / Um_b."],
["Choix optimal","Pour des substituts parfaits, si TMS qa,qb < pa/pb (a relativement plus cher), le consommateur…",["consomme uniquement le bien b","consomme uniquement le bien a","consomme les deux biens à parts égales","n’a pas d’optimum"],0,"Le bien a coûte trop cher par rapport à ce qu’il apporte : on ne consomme que b. Si TMS > pa/pb, on ne consomme que a."],
["Choix optimal","Pour des substituts parfaits, si TMS = pa/pb…",["on consomme uniquement a","on consomme uniquement b","tous les paniers de la droite conviennent","aucun panier n’est optimal"],2,"La droite de budget est confondue avec la droite d’indifférence."],
["Choix optimal","Pour des biens complémentaires, le panier optimal respecte…",["TMS = pa/pb uniquement","la proportionnalité a·qa = b·qb et la contrainte budgétaire","qa = qb dans tous les cas","Um_a = Um_b"],1,"L’optimum est atteint quand le coin de l’équerre touche la droite de budget."],
["Choix optimal","Biens complémentaires consommés à parts égales (qa = qb), R = 100, pa = 3, pb = 2. Quel est qa ?",["20","25","33","50"],0,"qa = R / (pa + pb·a/b) = 100 / (3 + 2) = 20. Vérification : 3×20 + 2×20 = 100."],
["Revenu","Un bien normal est un bien dont la demande…",["augmente quand le revenu augmente","baisse quand le revenu augmente","ne dépend pas du revenu","augmente quand le prix augmente"],0,"Bien inférieur : la demande baisse quand le revenu augmente (souvent des biens de moins bonne qualité)."],
["Revenu","Le chemin d’expansion du revenu est l’ensemble des paniers optimaux quand…",["le revenu varie, prix inchangés","le prix varie, revenu inchangé","les préférences changent","les deux prix varient"],0,"La courbe d’Engel relie, elle, le revenu à la consommation d’un bien, prix inchangés."],
["Revenu","La courbe d’Engel représente la relation entre…",["le prix et la quantité demandée","le revenu et la consommation d’un bien","l’utilité et le revenu","les deux biens"],1,"Elle n’est pas forcément une droite. Pour un bien normal, elle est nécessairement croissante."],
["Revenu","Un bien de luxe est un bien dont la demande…",["croît proportionnellement plus vite que le revenu","croît proportionnellement moins vite que le revenu","baisse quand le revenu augmente","ne change pas"],0,"Bien de nécessité : la demande croît proportionnellement moins vite que le revenu."],
["Revenu","Le prix du bien a baisse. Parmi ces résultats, lequel est impossible ?",["Hausse de qa et baisse de qb","Hausse des deux biens","Baisse simultanée des deux biens","Hausse de qa et qb inchangé"],2,"On ne peut pas dire a priori ce que cela donne pour a et b, mais une baisse simultanée de la consommation des deux biens est exclue."],
["Prix","Une courbe de demande place…",["la quantité en ordonnée et le prix en abscisse","la quantité en abscisse et le prix en ordonnée","le revenu en abscisse et la quantité en ordonnée","l’utilité en ordonnée"],1,"Elle est obtenue en faisant varier le prix du bien. La fonction de demande inverse exprime le prix en fonction de la quantité."],
["Prix","Si qa = a·m / pa, la demande inverse est…",["pa = a·m / qa","pa = qa / (a·m)","pa = a·m·qa","pa = m / qa"],0,"On isole simplement pa : pa = a·m / qa."],
["Prix","La fonction de demande qa = xa(pa, pb, m) exprime…",["le prix en fonction des quantités","la quantité optimale en fonction des prix et du revenu","l’utilité en fonction du revenu","le revenu en fonction du prix"],1,"Elle donne les quantités optimales consommées de chaque bien en fonction des prix et du revenu."],
["Hicks / Slutsky","Quand le prix du bien A varie, on distingue…",["un effet de substitution et un effet de revenu","un effet de prix et un effet d’utilité","un effet d’offre et un effet de demande","un effet de luxe et un effet de nécessité"],0,"Substitution : modification du taux d’échange objectif. Revenu : modification du pouvoir d’achat."],
["Hicks / Slutsky","Dans la décomposition de Hicks, le passage E → H correspond à…",["l’effet de revenu","l’effet de substitution","l’effet total","la variation du prix"],1,"E → H = effet de substitution (sur la droite fictive). H → F = effet de revenu (F étant le nouvel optimum)."],
["Hicks / Slutsky","Le revenu fictif qui permet d’acheter le panier initial aux nouveaux prix correspond à une variation Δm égale à…",["qa·Δpa","Δpa / qa","pb·Δqb","m·Δpa"],0,"Δm = m′ − m = qa·(pa′ − pa) = qa·Δpa."],
["Hicks / Slutsky","Lait : qa = 10 + m/(10·pa), m = 120 €, le prix passe de 3 € à 2 €. Quel est le revenu fictif m′ ?",["106 €","120 €","134 €","14 €"],0,"Demande initiale : 14 L. Ressources libérées : 14 × 1 € = 14 €, donc m′ = 120 − 14 = 106 €."],
["Hicks / Slutsky","Même exemple : l’effet de substitution vaut…",["1,3 L","0,7 L","2 L","14 L"],0,"Avec m′ = 106 € : 10 + 106/20 = 15,3 L, soit 15,3 − 14 = 1,3 L."],
["Hicks / Slutsky","Même exemple : l’effet de revenu vaut…",["0,7 L","1,3 L","2 L","−0,7 L"],0,"Demande finale 16 L ; 16 − 15,3 = 0,7 L. Total : 1,3 + 0,7 = 2 L."],
["Hicks / Slutsky","Selon l’identité de Slutsky, la variation totale de la demande est…",["l’effet de substitution moins l’effet de revenu","l’effet de substitution plus l’effet de revenu","l’effet de revenu seulement","le produit des deux effets"],1,"Δqa = Δqa^s + Δqa^R."],
["Hicks / Slutsky","L’effet de substitution est toujours…",["de même signe que la variation du prix","de signe contraire à la variation du prix","positif","nul"],1,"Si le prix monte, l’effet de substitution fait baisser la demande ; si le prix baisse, il la fait monter."],
["Hicks / Slutsky","Pour un bien normal, l’effet de revenu d’une hausse de prix est…",["positif","négatif","nul","de signe indéterminé"],1,"La hausse du prix diminue le pouvoir d’achat, donc réduit la demande d’un bien normal. Il est positif pour un bien inférieur."],
["Hicks / Slutsky","La loi de la demande dit que si un bien est normal, alors sa demande…",["baisse quand son prix augmente","augmente quand son prix augmente","ne dépend pas de son prix","baisse quand le revenu augmente"],0,"Substitution et revenu vont dans le même sens (négatifs pour une hausse de prix) : la demande décroît avec le prix."]
]}
,{id:"m2",m:"Microéconomie",t:"Chapitre 2 – Les producteurs",q:[
["Introduction","Que sont les inputs d’un producteur ?",["Les produits finaux vendus","Les biens et services qu’il se procure pour produire (matières premières, énergie…)","Ses profits","Ses clients"],1,"Inputs (intrants) → production → output (extrant, produit final). Ex. chaussure : cuir et ficelle en inputs."],
["Introduction","Comme le consommateur, le producteur est rationnel et maximise son profit sous deux contraintes. Lesquelles ?",["Prix et revenu","Les coûts et la technologie","Les impôts et la demande","Le temps et l’espace"],1,"Coûts (prix des inputs) et technologie (fonction de production)."],
["Introduction","Dans le problème du producteur, quelles sont les variables exogènes ?",["Les quantités d’inputs demandées","Les prix des inputs p₁, p₂ et le prix de l’output p","La quantité offerte","Le profit"],1,"Exogènes : p₁, p₂, p. Endogènes : demandes d’inputs q₁ᵈ, q₂ᵈ et offre qᵒ(p)."],
["Introduction","Quelles sont les trois étapes du raisonnement du producteur ?",["Technologie réalisable → combinaison optimale (coût minimal) → offre et demande d’inputs (profit max)","Offre → demande → prix","Coûts → recettes → impôts","Isoquante → utilité → budget"],0,"On regroupe les deux premières étapes pour déterminer l’offre et la demande d’inputs qui maximisent le profit."],
["Fonction de production","La fonction de production q = f(q₁ ; q₂) donne…",["le coût minimal de production","la quantité maximale d’output obtenue avec des quantités données d’inputs","le profit","la demande d’inputs"],1,"Elle décrit la technologie. La frontière des possibilités de production (FPP) est le maximum atteignable ; la zone grisée en dessous (ensemble de production) correspond à une utilisation non efficace des ressources."],
["Fonction de production","Contrairement à l’utilité, le niveau de production a un sens…",["ordinal","cardinal","aucun","uniquement relatif"],1,"Il mesure réellement la quantité produite : 20 unités, c’est deux fois plus que 10."],
["Fonction de production","La plupart des fonctions de production ont une productivité marginale du travail PmL…",["croissante","constante","décroissante","nulle"],2,"PmL = F(K, L+1) − F(K, L) = pente de la fonction de production. Exemples : q = √q₁ ou ln(q₁). Vrai aussi pour le capital (terre sur-exploitée)."],
["Fonction de production","10 machines à coudre : on passe d’une à deux puis trois ouvrières par machine. La production…",["augmente toujours autant","augmente de moins en moins (productivité marginale décroissante)","diminue immédiatement","reste identique"],1,"La 1re ouvrière est très productive, la 2e produit moins, la 3e n’apporte quasiment rien."],
["Fonction de production","La fonction de Cobb-Douglas q = q₁^α × q₂^β (α, β > 0) suppose des inputs…",["parfaitement complémentaires","substituables","inutiles","indépendants des prix"],1,"On peut remplacer une quantité de l’un par l’autre à production constante."],
["Fonction de production","La fonction de Leontief q = min(a·q₁ ; b·q₂) suppose des inputs…",["substituables","parfaitement complémentaires","inférieurs","fixes à court terme"],1,"Inputs combinés en proportions fixes (ex. un taxi et son chauffeur)."],
["Fonction de production","Leontief : q = min(2q₁ ; 4q₂). Avec q₁ = 10 et q₂ = 8, que vaut q ?",["20","32","40","18"],0,"min(20 ; 32) = 20. L’input 2 est en excès : q₂ = 5 suffirait."],
["Isoquantes","Une isoquante de niveau q représente…",["les combinaisons d’inputs de même coût","toutes les combinaisons d’inputs produisant q unités d’output","un profit constant","les outputs possibles"],1,"Repère (q₁ ; q₂). Ex. : combinaisons machines / heures de travail pour fabriquer 10 pelotes de laine."],
["Isoquantes","Laquelle de ces propriétés est FAUSSE ?",["Elles sont continues","Elles se coupent parfois","Il y en a autant que de niveaux de production","Elles sont décroissantes"],1,"Comme les courbes d’indifférence, les isoquantes ne se coupent jamais. Continues car les biens sont parfaitement divisibles."],
["Isoquantes","Pour des inputs substituables (Cobb-Douglas), les isoquantes sont…",["des droites","des hyperboles décroissantes, strictement convexes, asymptotes aux axes","des équerres","des horizontales"],1,"Asymptotes : il faut toujours une quantité strictement positive d’input. Le degré de convexité traduit le degré de substituabilité."],
["Isoquantes","Pour des inputs parfaitement complémentaires, l’isoquante a la forme…",["d’une hyperbole","d’une droite","d’une équerre","d’un cercle"],2,"L’angle est atteint quand a·q₁ = b·q₂ = q. En dehors : gaspillage d’input 2 (branche verticale) ou d’input 1 (branche horizontale)."],
["Productivités","La productivité moyenne de l’input i est…",["PMᵢ = q / qᵢ","PMᵢ = ∂f/∂qᵢ","PMᵢ = qᵢ × q","PMᵢ = Δq₂/Δq₁"],0,"Elle mesure combien chaque unité d’input produit en moyenne (interprétation cardinale)."],
["Productivités","La productivité marginale de l’input i est…",["la production divisée par qᵢ","la dérivée partielle ∂f/∂qᵢ, les autres inputs restant constants","la somme des PM","toujours décroissante"],1,"Pmᵢ = ∂f/∂qᵢ ≥ 0 : gain de production dû à une quantité infinitésimale d’input en plus."],
["Productivités","Cobb-Douglas q = q₁^α q₂^β : que valent PM₁ et Pm₁ ?",["PM₁ = q₁^(α−1) q₂^β ; Pm₁ = α q₁^(α−1) q₂^β","PM₁ = α q₁^(α−1) q₂^β ; Pm₁ = q₁^(α−1) q₂^β","PM₁ = q₁^α ; Pm₁ = q₂^β","PM₁ = Pm₁ toujours"],0,"Pm₁ = α × PM₁, donc Pm₁ > PM₁ ⇔ α > 1."],
["Productivités","Cobb-Douglas : Pm₁ est décroissante quand…",["α > 1","α = 1","0 < α < 1","α < 0"],2,"Dérivée de Pm₁ = (α−1)·α·q₁^(α−2)·q₂^β. Si α > 1 : croissante ; α = 1 : constante."],
["Productivités","Si la productivité marginale d’un input est décroissante, la fonction de production est…",["convexe","concave","linéaire","discontinue"],1,"Pm croissante → convexe ; décroissante → concave ; constante → linéaire."],
["Productivités","Si Pmᵢ > PMᵢ, la productivité moyenne de l’input i est…",["croissante","décroissante","constante","nulle"],0,"Comme une moyenne de notes tirée vers le haut par une note supérieure."],
["Productivités","q = √(q₁·q₂), q₁ = 4, q₂ = 9. Que vaut Pm₁ ?",["0,75","1,5","3","6"],0,"Pm₁ = 0,5·q₁^(−0,5)·q₂^0,5 = 0,5 × 0,5 × 3 = 0,75 (PM₁ = 6/4 = 1,5)."],
["Rendements d’échelle","Pour λ > 1, les rendements d’échelle sont croissants si…",["f(λq₁, λq₂) = λ f(q₁, q₂)","f(λq₁, λq₂) > λ f(q₁, q₂)","f(λq₁, λq₂) < λ f(q₁, q₂)","f(λq₁, q₂) > f(q₁, q₂)"],1,"Croissants : production plus que proportionnelle. Constants : égalité. Décroissants : moins que proportionnelle."],
["Rendements d’échelle","Pour une Cobb-Douglas, les rendements d’échelle sont croissants si…",["α > 1","α + β > 1","α + β = 1","β > α"],1,"f(λq₁, λq₂) = λ^(α+β) f(q₁, q₂). Constants si α+β = 1, décroissants si α+β < 1."],
["Rendements d’échelle","q = q₁^0,3 × q₂^0,5 : les rendements d’échelle sont…",["croissants","constants","décroissants","indéterminés"],2,"α + β = 0,8 < 1 : doubler les inputs multiplie la production par 2^0,8 < 2."],
["Rendements d’échelle","Rendements d’échelle croissants ⇒ productivité moyenne … et Pm … PM",["croissante ; Pm > PM","décroissante ; Pm < PM","constante ; Pm = PM","croissante ; Pm < PM"],0,"Constants : PM constante, Pm = PM. Décroissants : PM décroissante, Pm < PM."],
["Rendements d’échelle","Productivité marginale décroissante implique-t-elle des rendements d’échelle décroissants ?",["Oui, toujours","Non : Pm peut décroître en restant supérieure à PM (rendements croissants)","Oui si α < 1","Non, Pm est constante"],1,"Pm décroissantes ⇏ RE décroissants. Ex. α = β = 0,8 : Pm₁ décroît mais α+β = 1,6 > 1."],
["Rendements d’échelle","Il y a économies d’échelle quand…",["le coût total baisse","le coût moyen est décroissant : produire plus baisse le coût unitaire","les prix des inputs montent","la production est constante"],1,"Causes : coûts fixes répartis, remises sur gros achats. Contraire : déséconomies d’échelle (coûts d’organisation, bureaucratie)."],
["Rendements d’échelle","Rendements croissants, prix d’inputs constants :",["le coût total croît plus vite que la production","le coût total croît moins vite que la production et le coût moyen baisse","le coût moyen augmente","le coût moyen est constant"],1,"Décroissants : le coût total croît plus vite que la production, donc le coût moyen augmente."],
["TMST","Le TMST en un point A d’une isoquante est…",["la valeur absolue de la pente de la tangente en A","le rapport des prix des inputs","la productivité moyenne","la pente de l’isocoût"],0,"On fait tendre B vers A (Δq₁ → 0) : la corde AB tend vers la tangente. Le taux entre deux points dépend de la corde choisie ; le TMST est ponctuel."],
["TMST","De A = (10 ; 8) à B = (30 ; 3) sur la même isoquante, le taux de substitution technique (valeur absolue) vaut…",["0,25","4","5","0,5"],0,"|Δq₂/Δq₁| = |3 − 8| / (30 − 10) = 5/20 = 0,25."],
["TMST","TMST(q₁, q₂) =",["Pm₂ / Pm₁","Pm₁ / Pm₂","p₁ / p₂","PM₁ / PM₂"],1,"Gain Δq₁·Pm₁ compensé par la perte Δq₂·Pm₂ : |Δq₂/Δq₁| = Pm₁/Pm₂ = f′q₁ / f′q₂."],
["TMST","Le TMST est décroissant le long d’une isoquante car…",["les prix changent","retirer de l’input 1 quand il est très utilisé demande peu d’input 2 en compensation","les isoquantes sont concaves","les inputs sont complémentaires"],1,"Il n’est défini que pour des inputs substituables : c’est la quantité minimale d’input 2 pour compenser une baisse infinitésimale d’input 1."],
["TMST","q = q₁·q₂ : le TMST en (q₁ ; q₂) = (2 ; 6) vaut…",["1/3","3","12","6"],1,"Pm₁ = q₂ = 6 et Pm₂ = q₁ = 2 ⇒ TMST = 6/2 = 3."],
["Isocoût","L’équation de la droite d’isocoût est…",["q₂ = −(p₁/p₂)·q₁ + C/p₂","q₂ = (p₁/p₂)·q₁ + C","q₂ = −(p₂/p₁)·q₁ + C/p₁","q₂ = −(Pm₁/Pm₂)·q₁"],0,"C = p₁q₁ + p₂q₂. Ordonnée à l’origine C/p₂, abscisse C/p₁ ; droite décroissante."],
["Isocoût","p₁ = 2 €, p₂ = 4 €, C = 100 €. Quantités maximales d’inputs 1 et 2 ?",["q₁ = 50 et q₂ = 25","q₁ = 25 et q₂ = 50","q₁ = 200 et q₂ = 400","q₁ = 50 et q₂ = 50"],0,"C/p₁ = 50 ; C/p₂ = 25. Pente : −p₁/p₂ = −0,5."],
["Isocoût","La pente de l’isocoût (valeur absolue) p₁/p₂ est…",["le TMST","le coût relatif des inputs : il dépend des prix, pas de la technique","la productivité marginale","le coût total"],1,"Ne pas confondre : coût relatif (prix) et TMST (technique de production)."],
["Isocoût","Plus une isocoût est éloignée de l’origine…",["plus le coût global est faible","plus le coût global est élevé","plus la pente est forte","plus la production est faible"],1,"Il existe une infinité d’isocoûts. Doubler les deux inputs double le coût (C′ = 2C), ordonnée 2C/p₂."],
["Isocoût","Le prix de l’input 1 augmente (p₁′ > p₁), C et p₂ inchangés. L’isocoût…",["se translate vers l’extérieur","pivote : l’abscisse à l’origine se rapproche de l’origine et la pente augmente en valeur absolue","pivote autour de l’abscisse à l’origine","ne change pas"],1,"C/p₁′ < C/p₁ ; l’ordonnée à l’origine C/p₂ reste inchangée."],
["Combinaison optimale","La combinaison productive optimale (inputs substituables) vérifie…",["TMST = Pm₁/Pm₂ = p₁/p₂ (isocoût tangent à l’isoquante)","PM₁ = PM₂","p₁ = p₂","Pm₁ = p₁"],0,"C’est le coût minimal pour produire q. Deux points A et B d’une même isoquante produisent autant mais coûtent différemment : seul le point de tangence est optimal."],
["Combinaison optimale","Pourquoi les demandes d’inputs q₁*, q₂* sont-elles dites conditionnelles ?",["Elles dépendent du niveau de production visé","Elles dépendent du revenu","Elles dépendent du profit","Elles sont aléatoires"],0,"q₁*(q, p₁, p₂) et q₂*(q, p₁, p₂) dépendent de la production q que l’on souhaite atteindre."],
["Combinaison optimale","Le sentier d’expansion est…",["l’ensemble des combinaisons à coût minimal quand la production varie","l’isoquante la plus haute","l’ensemble des isocoûts","la courbe de profit"],0,"Il vérifie p₁/p₂ = TMST = Pm₁/Pm₂ et dépend des prix des inputs (si substituables). Le producteur choisit toujours un point dessus."],
["Combinaison optimale","Pm₁/Pm₂ = 1,5 < p₁/p₂ = 2. Le producteur doit…",["plus d’input 1, moins d’input 2","moins d’input 1, plus d’input 2","ne rien changer","produire moins"],1,"L’input 1 est trop cher pour ce qu’il rapporte : on le substitue partiellement par l’input 2 jusqu’à TMST = p₁/p₂."],
["Inputs complémentaires","Leontief : la combinaison optimale est…",["tangente isocoût/isoquante","à l’angle de l’isoquante, sans gaspillage : q₁* = q/a et q₂* = q/b","sur n’importe quelle branche","toujours q₁ = q₂"],1,"Seul l’angle produit q au coût minimum, quels que soient les prix."],
["Inputs complémentaires","Pour des inputs parfaitement complémentaires, le sentier d’expansion…",["dépend des prix","est la droite a·q₁ = b·q₂ (q₂ = (a/b)·q₁), indépendante des prix","est horizontal","n’existe pas"],1,"Il ne dépend que de la stricte proportion entre inputs."],
["Inputs complémentaires","q = min(q₁ ; 2q₂), q = 10, p₁ = 3 €, p₂ = 4 €. Coût minimal ?",["50 €","70 €","30 €","40 €"],0,"q₁* = 10, q₂* = 5 ⇒ CT = 3×10 + 4×5 = 50 €."],
["Coûts","La fonction de coût total CT(q) = p₁q₁* + p₂q₂* indique…",["la dépense minimale pour produire q en combinant au mieux les inputs","le profit maximal","la recette totale","la dépense maximale"],0,"On l’obtient en substituant les demandes conditionnelles dans l’isocoût : CT dépend de q, p₁, p₂. Ainsi définie, elle néglige les coûts fixes (ex. loyers)."],
["Coûts","CT(q) = CV(q) + CF. Le coût moyen vaut…",["CM = CT/q = CF/q + CV(q)/q = CFM + CVM","CM = dCT/dq","CM = CF + CV","CM = p"],0,"Coût moyen = coût fixe moyen + coût variable moyen."],
["Coûts","Quand q augmente (prix d’inputs constants)…",["CFM diminue et CVM augmente","CFM augmente et CVM diminue","les deux diminuent","les deux augmentent"],0,"Deux forces opposées : à faible production la baisse du CFM l’emporte, donc CM baisse d’abord puis remonte."],
["Coûts","Le coût marginal Cm = dCT/dq est croissant parce que…",["les coûts fixes augmentent","la productivité marginale du travail est décroissante","les prix baissent","la recette augmente"],1,"Cm = augmentation du coût pour une unité supplémentaire produite."],
["Coûts","Si Cm > CM, le coût moyen…",["diminue","augmente","est constant","est nul"],1,"Si Cm < CM, CM diminue (intérêt à produire plus). Cm coupe CM en son minimum (Cm = CM)."],
["Coûts","CT(q) = 100 + 5q + q². Quelle production minimise le coût moyen ?",["q = 5","q = 10","q = 20","q = 100"],1,"CM = 100/q + 5 + q ; Cm = 5 + 2q. Cm = CM ⇒ q = 10 (CM = Cm = 25 €)."],
["Étude de cas","Usine de vêtements : quels coûts sont fixes ?",["Tissu et travail","Machines et usine (10 000 €)","Le tissu seulement","Aucun"],1,"Variables : tissu (2 €/vêtement) et travail (10 €/h). Pour Q = 100 : CT = 11 300 = CF 11 000 + CV 300."],
["Étude de cas","Dans l’étude de cas, la part des coûts fixes dans le coût total…",["passe de 100 % à environ 89 %","passe de 50 % à 100 %","reste à 50 %","tombe à 0 %"],0,"Les coûts fixes dominent, mais leur poids baisse avec la production (CT de 11 012 € à 67 300 €)."],
["Étude de cas","Coût marginal entre Q = 700 (CT = 32 080 €) et Q = 750 (CT = 34 600 €) ?",["50,4 €","46 €","2 520 €","34,6 €"],0,"Cm = ΔCT/ΔQ = 2 520 / 50 = 50,4 €."],
["Étude de cas","Le coût unitaire minimal (≈ 46 €) est atteint pour Q ≈ …",["300","700","1 150","100"],1,"CM(700) = 32 080/700 ≈ 45,8 €. Là, Cm = CM : seuil de rentabilité."],
["Étude de cas","p = 50 €. Quelle offre et quel profit unitaire ?",["750 unités ; ≈ 3,9 €","700 unités ; 0 €","900 unités ; 20 €","450 unités ; −13 €"],0,"p = Cm ⇒ Q = 750. CM = 34 600/750 ≈ 46,1 € ⇒ 3,9 €/unité. Profit total : 37 500 − 34 600 = 2 900 €."],
["Étude de cas","p = 35 €. Quelle est la situation ?",["Elle offre 450 unités et perd ≈ 13 € par vêtement","Elle n’offre rien","Elle offre 450 unités et gagne 13 €","Elle offre 750 unités"],0,"p = Cm ⇒ Q = 450 ; CM = 21 680/450 ≈ 48,2 €. Résultat : 15 750 − 21 680 = −5 930 €."],
["Étude de cas","p = 70 € : l’entreprise offre 900 unités (Cm ≈ 70). Profit total ?",["19 300 €","29 000 €","63 000 €","43 700 €"],0,"Recette 63 000 − CT 43 700 = 19 300 €, soit ≈ 21,4 €/unité (CM ≈ 48,6 €). La diapo écrit 70 − 41 = 29 €, ce qui ne colle pas avec le tableau."],
["Étude de cas","Tableau de productivité : p = 2 €, salaire w = 4 €. Jusqu’où embaucher ?",["Jusqu’à L = 5 (bénéfice marginal 0 ; −2 € à L = 6)","Jusqu’à L = 10","Jusqu’à L = 1","Jusqu’à L = 7"],0,"Bénéfice marginal = Pm × p − w. On embauche tant que p × Pm ≥ w."],
["Profit","En concurrence, pour q unités vendues au prix p : RT, RM et Rm valent…",["RT = pq ; RM = p ; Rm = p","RT = p ; RM = pq ; Rm = q","RT = q ; RM = p ; Rm = 0","RT = RM = Rm = p"],0,"RM = pq/q = p ; Rm = dRT/dq = p."],
["Profit","Le profit Π = RT − CT est maximal quand…",["p = Cm (Rm = Cm)","p = CM","Cm = 0","CF = CV"],0,"dΠ/dq = p − Cm = 0. Si p > Cm : produire plus augmente le profit ; si p < Cm : produire moins."],
["Profit","Le seuil de rentabilité (point mort) correspond à…",["p = CM, au minimum du coût moyen : profit nul","p = Cm","CF = 0","RT = CV"],0,"Π = q(p − CM). p > CM : profit > 0 ; p < CM : perte. Point mort : coûts totaux = recettes totales."],
["Profit","Au-delà du seuil de rentabilité…",["Cm > CM : si p = Cm alors p > CM, profit unitaire positif","Cm < CM","le profit est nul","CM décroît"],0,"3 étapes : p = Cm donne q ; seuil CM = Cm ; au-delà, profit unitaire p − CM > 0."],
["Profit","CT(q) = 100 + 5q + q², p = 45 €. Production optimale et profit ?",["q = 20 ; Π = 300 €","q = 10 ; Π = 0","q = 45 ; Π = 0","q = 20 ; Π = 900 €"],0,"45 = 5 + 2q ⇒ q = 20. RT = 900, CT = 100 + 100 + 400 = 600 ⇒ Π = 300 €."],
["Offre","Rendements décroissants (Cm croissant, supérieur à CM) : la fonction d’offre est…",["la courbe de coût marginal : finie, croissante avec le prix, nulle si p = 0","la courbe de CM","verticale","infinie"],0,"Produire coûte de plus en plus cher. Les demandes d’inputs sont finies."],
["Offre","Rendements d’échelle croissants (CM décroissant, Cm < CM) :",["le profit maximal est fini","le profit tend vers l’infini : offre et demande d’inputs infinies, incompatible avec la CPP","l’offre est nulle","CM augmente"],1,"Cela suppose l’absence de coûts fixes. Le producteur est incité à produire le plus possible."],
["Offre","Rendements d’échelle constants (CM = Cm constant) : si p > CM…",["il n’offre rien","il offre une quantité infinie, incompatible avec la CPP","il est indifférent","il produit 1 unité"],1,"Si p < CM il ne produit pas ; si p = CM, Π = 0, indifférent et la demande fixe la production."],
["Offre : méthodes","Méthode via la fonction de coût : quel ordre ?",["Min p₁q₁ + p₂q₂ s.c. f = q → CT → Cm = dCT/dq → p = Cm → offre","Max Π → CT → isoquante","p = CM → CT → Cm","Isocoût → TMST → utilité"],0,"Demandes conditionnelles q₁*, q₂* → CT → Cm → offre qˢ(p₁, p₂, p)."],
["Offre : méthodes","Méthode via le sentier d’expansion q₂ = g(q₁) : on…",["substitue g dans Π = p·f(q₁, g(q₁)) − p₁q₁ − p₂g(q₁), maximise en q₁, puis déduit q₂ et l’offre","dérive le coût marginal","égalise p et CM","minimise le coût"],0,"Les choix optimaux sont nécessairement sur le sentier d’expansion."],
["Offre : méthodes","Max Π = p·f(q₁, q₂) − p₁q₁ − p₂q₂ donne comme conditions…",["p × Pmᵢ = pᵢ, soit f′qᵢ = pᵢ/p","Pm₁ = Pm₂","p₁ = p₂","Pmᵢ = 0"],0,"Les inputs sont rémunérés à leur productivité marginale. Tant que p × Pmᵢ > pᵢ, on utilise plus d’input i."],
["Offre : méthodes","En divisant les deux conditions du premier ordre du profit, on retrouve…",["TMST = f′q₁/f′q₂ = p₁/p₂ : (q₁*, q₂*) est sur le sentier d’expansion","p = Cm","CM = Cm","TMST = 1"],0,"Maximisation du profit et minimisation du coût sont cohérentes."]
]}
,{id:"c2",m:"Macroéconomie",t:"Chapitre 2 – Inflation et chômage",q:[
["Inflation : coûts","Le taux d’inflation est…",["la hausse en % du niveau général des prix (en général l’IPC)","la hausse du prix d’un seul bien","la baisse du pouvoir d’achat en euros","la croissance de la monnaie"],0,"Sur longue période, l’inflation a été bien plus forte et plus variable qu’aujourd’hui (guerres, chocs pétroliers de 1973 et 1979). Forte inflation en 2022-2023."],
["Inflation : coûts","Au total, une inflation excessive…",["profite à tous","fait des gagnants et des perdants, rend l’allocation des ressources moins efficace et coûte à l’économie","est neutre","réduit toujours le chômage durablement"],1,"Plus de pertes que de gains. À court terme elle peut sembler bonne (revenus nominaux, moins de chômage) : c’est la métaphore de Friedman sur l’alcoolisme (bien-être le soir, mal le lendemain)."],
["Inflation : coûts","Revenus nominaux +2 % et inflation +2 % : le revenu réel…",["augmente de 2 %","est inchangé","baisse de 2 %","double"],1,"Revenu réel = revenu nominal ÷ prix. L’inflation est internalisée avec retard (« train de retard ») et crée de l’incertitude."],
["Inflation : coûts","Quel agent GAGNE avec une inflation imprévue ?",["Le prêteur à taux fixe","L’emprunteur à taux fixe","Le salarié sans indexation","Le détenteur d’espèces"],1,"Gagnent : employeur (contrat sans indexation), emprunteur à taux fixe, ménage ayant un devis de travaux, détenteurs d’actifs (or, immobilier). Pouvoir d’achat érodé entre-temps."],
["Inflation : coûts","Je prête 100 € à 8 % ; l’inflation est de 20 %. Taux d’intérêt réel ?",["+8 %","−12 %","+28 %","−20 %"],1,"r = i − π = 8 − 20 = −12 %. Avec 108 € je n’achète que 9 places de cinéma (à 12 €) au lieu de 10 : les prêteurs perdent, les emprunteurs gagnent."],
["Inflation : coûts","Placement de 1 000 € à 5 %, inflation 4 %, impôt de 30 % sur les intérêts nominaux. Il reste…",["1 050 €","1 035 €, soit un rendement réel après impôt négatif (≈ −0,5 %)","1 040 €","1 000 €"],1,"Intérêts 50 €, impôt 15 € ; il fallait 1 040 € pour garder son pouvoir d’achat. L’impôt frappe r + π : on est taxé sur une perte."],
["Inflation : coûts","Barème : 0 % jusqu’à 30 000 €, 30 % au-delà. Salaire 30 000 €, inflation 10 % (salaire → 33 000 €). Impôt ?",["0 €","900 €","3 000 €","9 900 €"],1,"3 000 € × 30 % = 900 € sans être plus riche : c’est la progressivité à froid (seuils non indexés). L’État gagne, mais l’inflation relève aussi ses dépenses."],
["Inflation : coûts","La « taxe d’inflation » frappe…",["les détenteurs de monnaie (encaisses) dont la valeur s’érode","les détenteurs d’or","les banques","les propriétaires immobiliers"],0,"Détenir de la monnaie devient coûteux : distorsion dans le temps (dépenser aujourd’hui plutôt qu’épargner). Gagnants : actifs réels et banques."],
["Inflation : coûts","Quels sont les 4 coûts de l’inflation pour l’économie ?",["Prix relatifs, coûts de transaction, incertitude, répartition des revenus","Chômage, déficit, dette, change","Taux, impôts, salaires, loyers","Offre, demande, stocks, flux"],0,"Ils distordent l’allocation des ressources à l’échelle nationale."],
["Inflation : coûts","Les prix relatifs comptent car…",["ils guident les choix (coût d’opportunité) ; leur déformation entraîne des décisions sous-optimales","seuls les prix absolus comptent","ils sont fixes","ils mesurent l’inflation"],0,"Ex. : si le rapport prix théâtre / prix cinéma passe de 3 à 4, les loisirs se distordent en faveur du cinéma."],
["Inflation : coûts","Les coûts de catalogue (menu costs) sont…",["le coût réel de modifier les listes de prix","les impôts sur les ventes","le coût des catalogues papier uniquement","les taxes douanières"],0,"Ils font partie des coûts de transaction, comme le coût de détention de la monnaie (Allemagne 1921-1924 : des coureurs portaient l’argent à la banque plusieurs fois par jour)."],
["Inflation : coûts","Pourquoi l’incertitude liée à l’inflation est-elle coûteuse ?",["Elle brouille le signal des prix, perturbe l’investissement et déprime la croissance","Elle fait baisser les impôts","Elle supprime les risques","Elle stabilise les taux"],0,"On ne sait pas quel sera le rendement de l’investissement demain : mauvaise allocation des ressources."],
["Inflation : coûts","L’inflation affecte davantage…",["les plus pauvres (moins de pouvoir de négociation) ; retraites et fonctionnaires s’ajustent moins souvent","les plus riches","les propriétaires d’or","les banques"],0,"En hyperinflation : redistribution massive, ceux qui détiennent terres, devises, or préservent leur richesse."],
["Inflation : coûts","Désinflation signifie…",["baisse généralisée des prix","ralentissement du taux d’inflation (prix qui montent moins vite)","hausse des prix","hyperinflation"],1,"La déflation est un taux d’inflation négatif (baisse généralisée des prix) : mêmes coûts que l’inflation, dettes plus lourdes en réel, consommateurs qui attendent, risque de faillites et de crises bancaires."],
["Monnaie","Quelles sont les trois fonctions de la monnaie ?",["Réserve de valeur, unité de compte, intermédiaire des échanges","Épargne, crédit, change","Prix, salaire, profit","Offre, demande, équilibre"],0,"Chacune est entamée par l’inflation. La liquidité est la facilité à convertir un actif en moyen d’échange : la monnaie est l’actif le plus liquide."],
["Monnaie","Quelle est la bonne chronologie des formes de monnaie ?",["Marchandise (valeur intrinsèque) → fiduciaire (pièces et billets par convention) → scripturale (comptes)","Scripturale → fiduciaire → marchandise","Fiduciaire → marchandise → scripturale","Marchandise → scripturale → fiduciaire"],0,"Billets convertibles en or jusqu’aux années 1930 (étalon-or). Fiduciaire et scripturale valent par le statut légal donné par l’État et par la confiance."],
["Monnaie","La souveraineté monétaire (émettre la monnaie via la banque centrale) est…",["une fonction régalienne de l’État","déléguée au privé","une fonction des syndicats","réservée aux banques commerciales"],0,"Fonctions régaliennes : sécurité extérieure, ordre public, justice, souveraineté monétaire."],
["Monnaie","Dans les agrégats monétaires, M0 correspond à…",["la base monétaire : pièces et billets + réserves auprès de la banque centrale","M1 + dépôts à terme","les dépôts à vue","les bons du Trésor"],0,"M1 = M0 + dépôts à vue ; M2 = M1 + dépôts à terme (livret A, LDD…) ; M3 = M2 + instruments négociables (OPCVM). M0 est ce que contrôle la BCE."],
["Monnaie","Comment la banque centrale accroît-elle l’offre de monnaie ?",["Par des opérations d’open market : rachat de titres aux banques ou prise de titres en pension (M0 augmente)","En vendant des titres","En baissant les impôts","En fixant les prix"],0,"Elle accroît les réserves des banques. Instruments : open market et facilités permanentes, ou réserves obligatoires (peu utilisées récemment) ; contrôle imparfait de l’offre."],
["Monnaie","Réserves fractionnaires signifie que la banque…",["ne prête rien","conserve une part des dépôts en réserves et prête le reste","prête plus que les dépôts","détient 100 % en réserves"],1,"Réserves intégrales → pas de prêt. Fractionnaires : ex. dépôt 1 000 €, réserves 200 €, prêts 800 € (coefficient de réserves 20 %)."],
["Monnaie","Dépôt initial 1 000 € et coefficient de réserves rr = 20 %. Offre totale de monnaie ?",["1 800 €","5 000 €","1 200 €","2 000 €"],1,"Offre = (1/rr) × dépôt = 5 × 1 000. Somme 1 + (1−rr) + (1−rr)² + … = 1/rr. Après le 1er prêt : 1 800 €."],
["Monnaie","Quel est le double rôle des banques commerciales ?",["Intermédiation financière et création monétaire","Impôt et dépense","Émission de billets et fixation des taux directeurs","Assurance et retraite"],0,"Elles sont, avec la banque centrale, les seules à agir directement sur l’offre de monnaie."],
["Monnaie","Dans le modèle d’offre de monnaie, que valent la base monétaire B et l’offre M ?",["B = C + R ; M = C + D","B = C + D ; M = C + R","B = D ; M = R","B = R/D ; M = C/D"],0,"rr = R/D (coefficient de réserves), cr = C/D (coefficient d’encaisses)."],
["Monnaie","Le multiplicateur monétaire est…",["m = (cr + 1)/(cr + rr)","m = (cr + rr)/(cr + 1)","m = 1/(cr·rr)","m = rr − cr"],0,"M = m × B. Chaque euro de base produit m euros de monnaie (monnaie « à haute puissance »)."],
["Monnaie","cr = 0,2, rr = 0,1, B = 100. L’offre de monnaie M vaut…",["400","300","100","1 000"],0,"m = 1,2/0,3 = 4 ⇒ M = 400."],
["Monnaie","Effet sur le multiplicateur m ?",["rr ↑ ⇒ m ↓ ; cr ↑ ⇒ m ↓ ; B ↑ ⇒ M ↑","rr ↑ ⇒ m ↑","cr ↑ ⇒ m ↑","Aucun effet"],0,"Plus rr est élevé, moins la monnaie se multiplie. Plus cr est élevé, plus la monnaie est détenue en espèces et moins les banques peuvent en créer."],
["Théorie quantitative","L’équation quantitative M × V = P × T (ou P × Y) est…",["une identité comptable toujours vraie","une hypothèse à tester","une loi du marché","une fonction de demande"],0,"V = vitesse de circulation de la monnaie (nombre de fois qu’une unité sert aux transactions). Version Fisher (1911) : M × V = P × Y, Y = PIB réel, P = déflateur."],
["Théorie quantitative","50 transactions à 2 € en moyenne et M = 20 €. La vitesse de circulation V vaut…",["5","2","10","100"],0,"P × T = 100 € ; V = 100/20 = 5 : chaque euro change 5 fois de main par an."],
["Théorie quantitative","Selon la TQM, si V est constante et Y fixé par les facteurs de production, alors…",["le niveau des prix est proportionnel à l’offre de monnaie","M n’a pas d’effet","les prix sont fixes","V s’ajuste à P"],0,"En taux : ΔM% + ΔV% = ΔP% + ΔY%."],
["Théorie quantitative","M +5 %, V constante, Y +2 %. L’inflation vaut…",["3 %","7 %","5 %","2 %"],0,"ΔP% = ΔM% + ΔV% − ΔY% = 5 + 0 − 2 = 3 %."],
["Théorie quantitative","Les monétaristes (Friedman, années 1970-1980) soutiennent que…",["la politique monétaire n’agit pas sur la croissance réelle et l’inflation peut être d’origine monétaire","la monnaie n’a aucun effet","l’inflation vient des salaires uniquement","la politique monétaire détermine le PIB réel"],0,"Théorie quantitative esquissée par David Hume (XVIIIe s.)."],
["Théorie quantitative","Le seigneuriage est…",["l’émission de monnaie « pour soi » par la BC liée à l’État pour financer les déficits, source d’inflation (taxe d’inflation)","un impôt sur le revenu","une aide sociale","un taux d’intérêt"],0,"Pour la TQM, la croissance de l’offre de monnaie est la cause de l’inflation."],
["Théorie quantitative","La demande d’encaisses réelles (M/P)ᵈ = k × Y est…",["croissante du revenu et décroissante du taux d’intérêt","décroissante du revenu","croissante du taux d’intérêt","indépendante du revenu"],0,"k est le pourcentage du revenu que les agents souhaitent détenir sous forme de monnaie. À l’équilibre (M/P)ˢ = (M/P)ᵈ : si l’offre réelle augmente à Y donné, le taux d’intérêt doit baisser."],
["Effet Fisher","L’effet Fisher s’écrit…",["i = r + E(π) : le taux nominal s’ajuste à l’inflation anticipée","r = i + π","i = r − π","π = i × r"],0,"Si l’inflation est internalisée par les taux nominaux, elle n’a pas d’effet sur le coût réel r de l’argent."],
["Effet Fisher","Que dit l’articulation TQM + effet Fisher ?",["À court terme les taux baissent quand la monnaie augmente ; à long terme ils remontent car ils intègrent l’inflation : la monnaie est un « voile »","Les taux baissent toujours","La monnaie crée de la croissance durable","Les prix sont constants"],0,"+1 % de croissance monétaire → +1 % d’inflation → +1 % de taux nominal. Les valeurs nominales changent, pas les réelles."],
["Effet Fisher","Quel impact « bénéfique » de l’inflation ?",["Elle assouplit le marché du travail : baisser les salaires nominaux est inacceptable, mais une hausse inférieure à l’inflation baisse le salaire réel","Elle réduit les inégalités","Elle améliore l’épargne","Elle supprime le risque"],0,"Si le salaire réel ne peut rester au-dessus de son équilibre, l’inflation peut aider à l’y ramener : moins de chômage, du moins à court terme."],
["Chômage : taux","Pour être chômeur (BIT), il faut…",["être sans emploi et rechercher activement un emploi","être sans emploi","être inscrit à l’assurance chômage","être découragé"],0,"Le critère de recherche active écarte les chômeurs découragés, étudiants, personnes au foyer. Population active = actifs occupés + chômeurs."],
["Chômage : taux","Le taux de chômage est…",["chômeurs / population active","chômeurs / population totale","actifs occupés / 15-64 ans","population active / 15-64 ans"],0,"Taux d’activité (participation) = pop active / pop en âge de travailler ; taux d’emploi = actifs occupés / pop en âge de travailler (15-64 ans)."],
["Chômage : taux","Pop. 15-64 ans : 40 M ; pop. active : 30 M ; emploi : 27 M. Taux d’activité, d’emploi et de chômage ?",["75 % ; 67,5 % ; 10 %","67,5 % ; 75 % ; 10 %","75 % ; 90 % ; 10 %","90 % ; 67,5 % ; 3 %"],0,"Activité 30/40 ; emploi 27/40 ; chômeurs 3 M, taux 3/30 = 10 %."],
["Chômage : taux","Un étudiant se met à chercher un emploi. Effets ?",["Chômage ↑, taux d’activité ↑, taux d’emploi inchangé","Les trois ↑","Chômage ↓","Aucun effet"],0,"Les trois taux peuvent ne pas évoluer conjointement. Chômage = court terme, activité = moyen terme, emploi = long terme (capacité à employer la population)."],
["Chômage : taux","Le taux de chômage peut sous-estimer le chômage à cause…",["des travailleurs découragés, des reconversions et du sous-emploi (temps partiel subi)","des personnes entre deux emplois","du plein emploi","des retraités"],0,"Il peut aussi surestimer : même en plein emploi il n’est pas nul (≈ 4 %, personnes entre deux emplois). Sa variation reste un bon indicateur."],
["Chômage : taux","Quelles catégories sont les plus touchées par le chômage ?",["Les jeunes (15-24 ans) et les moins diplômés","Les 50 ans et plus","Les diplômés de licence","Les cadres"],0,"Taux 2020 : 15-29 ans sans diplôme 33,8 % ; licence ou plus 5,3 % en moyenne ; ensemble 8 %."],
["Chômage : taux","Croissance et chômage…",["évoluent en sens inverse ; mais il peut exister des « reprises sans emploi »","évoluent dans le même sens","sont indépendants","sont constants"],0,"Croissance > moyenne : chômage ↓ ; croissance < moyenne : chômage ↑."],

const $=s=>document.querySelector(s),app=$("#app");
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cur=0;
let miss=LS.get("macro-miss")||[];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function id(c,i){return c.id+":"+i}
function home(){
  const c=CH[cur],secs=[...new Set(c.q.map(x=>x[0]))];
  const nm=miss.filter(m=>m.startsWith(c.id+":")).length;
  app.innerHTML=`<p class="s">Révisions – Économie</p><h1>QCM de révision</h1><p class="s">${CH.length} chapitres disponibles. Chaque réponse est expliquée.</p>
  <label class="s" for="ch">Chapitre</label><select id="ch">${CH.map((x,i)=>`<option value="${i}"${i===cur?" selected":""}>${x.m} – ${x.t}</option>`).join("")}</select>
  <label class="s" for="sec" style="display:block;margin-top:14px">Thème</label><select id="sec"><option value="">Tout le chapitre (${c.q.length} questions)</option>${secs.map(s=>`<option>${s}</option>`).join("")}</select>
  <button class="btn p" id="go" style="margin-top:18px">Commencer</button>
  <button class="btn" id="rv" ${nm?"":"disabled"}>Refaire mes questions ratées (${nm})</button>`;
  $("#ch").onchange=e=>{cur=+e.target.value;home()};
  $("#go").onclick=()=>{const s=$("#sec").value;start(c,c.q.map((q,i)=>i).filter(i=>!s||c.q[i][0]===s))};
  $("#rv").onclick=()=>start(c,c.q.map((q,i)=>i).filter(i=>miss.includes(id(c,i))));
}
function start(c,idx){S={c,idx:sh(idx),n:0,ok:0,bad:[]};ask()}
function ask(){
  const {c,idx,n}=S;if(n>=idx.length)return end();
  const q=c.q[idx[n]],o=sh(q[2].map((t,i)=>[t,i]));S.done=false;
  app.innerHTML=`<div class="top"><span>${q[0]}</span><span>${n+1} / ${idx.length}</span></div><div class="bar"><i style="width:${n/idx.length*100}%"></i></div>
  <p class="q">${q[1]}</p><div id="o">${o.map(([t,i],k)=>`<button class="btn" data-i="${i}">${t}</button>`).join("")}</div><div id="r"></div>`;
  document.querySelectorAll("#o .btn").forEach(b=>b.onclick=()=>pick(+b.dataset.i,q));
}
function pick(i,q){
  if(S.done)return;S.done=true;const good=i===q[3],k=id(S.c,S.idx[S.n]);
  document.querySelectorAll("#o .btn").forEach(b=>{b.disabled=true;if(+b.dataset.i===q[3])b.classList.add("ok");else if(+b.dataset.i===i)b.classList.add("ko")});
  if(good){S.ok++;miss=miss.filter(m=>m!==k)}else{S.bad.push(S.idx[S.n]);if(!miss.includes(k))miss.push(k)}
  LS.set("macro-miss",miss);
  $("#r").innerHTML=`<div class="ex"><b class="${good?"ok":"ko"}">${good?"Bonne réponse.":"Pas tout à fait."}</b> ${q[4]}</div><button class="btn p" id="nx">${S.n+1<S.idx.length?"Question suivante":"Voir mon score"}</button>`;
  $("#nx").onclick=()=>{S.n++;ask()};$("#nx").focus();
}
function end(){
  const {c,ok,idx,bad}=S,p=Math.round(ok/idx.length*100);
  app.innerHTML=`<p class="s">Série terminée</p><div class="sc">${ok} / ${idx.length}</div><p class="s">${p>=80?"Solide, tu maîtrises ce thème.":p>=50?"Bon début : reprends les points ratés.":"À retravailler : relis la fiche puis réessaie."}</p>
  ${bad.length?`<h2>À revoir</h2>`+bad.map(i=>`<div class="miss"><b>${c.q[i][1]}</b><br>${c.q[i][2][c.q[i][3]]}</div>`).join(""):""}
  ${bad.length?`<button class="btn p" id="rb">Refaire les questions ratées</button>`:""}<button class="btn" id="hm">Retour à l’accueil</button>`;
  if(bad.length)$("#rb").onclick=()=>start(c,bad);$("#hm").onclick=home;
}
document.addEventListener("keydown",e=>{if(!S||!S.done)return;if(e.key==="Enter"&&$("#nx"))$("#nx").click()});
home();
</script></body></html>
